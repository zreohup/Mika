<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Mika task desk</title>
    <link rel="icon" href="/mika-logo.png" />
    <link rel="stylesheet" href="/desk.css" />
    <script defer src="/desk.js"></script>
  </head>
  <body>
    <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
      <symbol id="i-new" viewBox="0 0 24 24"><path d="M13 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16.5 3.5l4 4M10 14l1-4 7.5-7.5 3 3L14 13z"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 14a3 3 0 0 1-3 3H9l-5 4v-4a3 3 0 0 1-2-3V7a3 3 0 0 1 3-3h13a3 3 0 0 1 3 3z"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.3h3"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-process" viewBox="0 0 24 24"><path d="M6 4v14M6 8h5m-5 8h5M14 8h6m-6 8h6"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></symbol>
      <symbol id="i-reply" viewBox="0 0 24 24"><path d="M5 5v7a3 3 0 0 0 3 3h11m-5-5 5 5-5 5"/></symbol>
    </defs></svg>
    <div class="workspace" id="workspace">
      <aside id="sidebar" class="rail" data-i18n-label="conversations" aria-label="Conversations">
        <div class="brand">
          <img src="/mika-logo.png" alt="" width="25" height="25" />
          <strong>Mika</strong>
          <button
            type="button"
            id="close-nav"
            class="icon-button nav-toggle"
            data-i18n-label="closeNav"
            aria-label="Close navigation"
          >
            <svg class="ico"><use href="#i-x" /></svg>
          </button>
        </div>
        <button type="button" id="new-chat" class="new-chat">
          <svg class="ico"><use href="#i-new" /></svg>
          <span data-i18n="newChat">New chat</span>
        </button>
        <div class="rail-label">
          <span data-i18n="recentChats">Recent conversations</span>
          <span id="count"></span>
        </div>
        <nav id="threads" data-i18n-label="conversations" aria-label="Conversations"></nav>
        <details id="connection-details" class="device-control">
          <summary>
            <svg class="ico"><use href="#i-phone" /></svg>
            <span id="device-label" data-i18n="myPhone">My phone</span>
            <span class="connection-state" id="connection-line" data-i18n="connecting">Connecting</span>
          </summary>
          <div class="device-pop">
            <strong data-i18n="connectionDetails">Connection details</strong>
            <dl>
              <div>
                <dt data-i18n="connectedPhone">Phone</dt>
                <dd id="target">—</dd>
              </div>
              <div>
                <dt data-i18n="taskService">Service</dt>
                <dd id="connection">—</dd>
              </div>
              <div>
                <dt data-i18n="phoneState">Phone state</dt>
                <dd id="device">—</dd>
              </div>
            </dl>
            <form id="pick" hidden>
              <label for="devices" data-i18n="chooseDevice">Choose phone</label>
              <select id="devices"></select>
              <button id="pick-device" data-i18n="usePhone">Use phone</button>
            </form>
            <div class="language">
              <label for="language" data-i18n="displayLanguage">Language</label>
              <select id="language">
                <option value="auto" data-i18n="browserLanguage">Browser default</option>
                <option value="zh" lang="zh-CN">简体中文</option>
                <option value="en" lang="en">English</option>
              </select>
            </div>
            <div class="device-actions">
              <span id="updated"></span>
              <button id="refresh" type="button" data-i18n="refreshNow">Update now</button>
            </div>
          </div>
        </details>
      </aside>
      <main id="main">
        <header class="thread-head">
          <button
            id="open-nav"
            type="button"
            class="icon-button nav-toggle"
            aria-controls="sidebar"
            aria-expanded="false"
            data-i18n-label="openNav"
            aria-label="Open conversations"
          >
            <svg class="ico"><use href="#i-left" /></svg>
          </button>
          <h1 id="thread-title" data-i18n="heading">Task desk</h1>
          <span id="thread-meta"></span>
          <button
            id="toggle-process"
            class="process-toggle"
            type="button"
            aria-expanded="false"
            hidden
          >
            <svg class="ico"><use href="#i-process" /></svg>
            <span data-i18n="viewProcess">View process</span>
          </button>
        </header>
        <div class="panes">
          <section id="thread" class="thread" data-i18n-label="currentChat" aria-label="Current conversation">
            <div class="notices">
              <p id="error" role="alert" hidden></p>
              <p id="notice" role="status" hidden></p>
            </div>
            <div id="scroll-thread">
              <div id="transcript"></div>
              <section id="process-content" class="inline-process" hidden data-i18n-label="process" aria-label="Execution process"></section>
            </div>
            <div class="composer-wrap">
              <div id="options"></div>
              <form id="compose">
                <label class="sr-only" id="compose-label" for="goal" data-i18n="message">Message to Mika</label>
                <textarea id="goal" rows="2" maxlength="4000" required></textarea>
                <div class="composer-foot">
                  <div class="compose-context">
                    <svg class="ico"><use href="#i-reply" /></svg>
                    <span id="compose-mode"></span>
                  </div>
                  <button type="submit" id="submit-goal" disabled>
                    <svg class="ico"><use href="#i-up" /></svg>
                  </button>
                </div>
              </form>
            </div>
          </section>
          <aside id="process-panel" class="process-panel" hidden data-i18n-label="sidePanel" aria-label="Side panel"></aside>
        </div>
      </main>
    </div>
  </body>
</html>
