[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mika-phone-cli"
version = "0.1.0"
description = "Command-line client for Mika's Android task API"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
mika = "mika_cli:main"

[tool.setuptools]
py-modules = ["mika_cli"]
packages = ["mika_desk"]
package-dir = {"" = "scripts"}

[tool.setuptools.package-data]
mika_desk = ["*.html", "*.css", "*.js", "mika-logo.png"]
